apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels: { app.kubernetes.io/name: analytics-service, app.kubernetes.io/part-of: intelliops }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: analytics-service } }
  template:
    metadata: { labels: { app.kubernetes.io/name: analytics-service, app.kubernetes.io/part-of: intelliops } }
    spec:
      initContainers:
        - name: migrate
          image: docker.io/abdellatifbiti03/erp-analytics-service
          command: [python, -m, app.migrate]
          envFrom: [{ secretRef: { name: analytics-service-secrets } }]
      containers:
        - name: analytics-service
          image: docker.io/abdellatifbiti03/erp-analytics-service
          ports: [{ name: http, containerPort: 8091 }]
          envFrom: [{ secretRef: { name: analytics-service-secrets } }]
          env:
            - { name: QUERY_MAX_ROWS, value: "50" }
            - { name: QUERY_TIMEOUT_MS, value: "5000" }
            - { name: ALLOWED_ROLES, value: "ROLE_ADMIN,ROLE_CSM,ROLE_LOGISTIC" }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }

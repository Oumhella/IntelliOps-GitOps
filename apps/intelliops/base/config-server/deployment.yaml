apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: intelliops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: intelliops
    spec:
      containers:
        - name: config-server
          image: docker.io/abdellatifbiti03/erp-config-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
            - name: SPRING_PROFILES_ACTIVE
              value: vault
            - name: SPRING_CLOUD_VAULT_HOST
              value: vault
            - name: SPRING_CLOUD_VAULT_PORT
              value: "8200"
            - name: SPRING_CLOUD_VAULT_SCHEME
              value: http
            - name: SPRING_CLOUD_VAULT_AUTHENTICATION
              value: APPROLE
            - name: SPRING_CLOUD_CONFIG_SERVER_VAULT_HOST
              value: vault
            - name: SPRING_CLOUD_CONFIG_SERVER_VAULT_PORT
              value: "8200"
            - name: SPRING_CLOUD_CONFIG_SERVER_VAULT_SCHEME
              value: http
          envFrom:
            - secretRef:
                name: config-server-vault-approle
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

apiVersion: apps/v1
kind: Deployment
metadata:
  name: paiement-service
  labels:
    app.kubernetes.io/name: paiement-service
    app.kubernetes.io/part-of: intelliops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paiement-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paiement-service
        app.kubernetes.io/part-of: intelliops
    spec:
      containers:
        - name: paiement-service
          image: docker.io/abdellatifbiti03/erp-paiement-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://erp-db:5432/erp_paiement
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: erp-kafka:29092
            - name: MINIO_URL
              value: http://minio:9000
            - name: MINIO_BUCKET_NAME
              value: invoices-erp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate-boutique-platform-types
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-migrate-boutique-platform-types
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate-schema
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: erp-db
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -ec
            - |
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d erp_stocks; do
                sleep 3
              done
              if psql -d erp_stocks -tAc \
                "SELECT to_regclass('public.boutiques')" | grep -q boutiques; then
                psql -v ON_ERROR_STOP=1 -d erp_stocks <<'SQL'
              ALTER TABLE boutiques
                DROP CONSTRAINT IF EXISTS boutiques_plateforme_type_check;
              ALTER TABLE boutiques
                ADD CONSTRAINT boutiques_plateforme_type_check
                CHECK (plateforme_type IN (
                  'MANUAL',
                  'SHOPIFY',
                  'WOOCOMMERCE',
                  'YOUCAN',
                  'MAGENTO',
                  'AUTRE'
                ));
              SQL
              fi
